{% extends "hospital/base.html" %}{% block content %}<div class="dashboard-head"><div><span class="eyebrow">ADMIN</span><h1>Medical Staff</h1></div><a class="btn primary" href="{% url 'add_medical_staff' %}">＋ Add Staff</a></div><div class="panel"><div class="table-wrap"><table><tr><th>Name</th><th>Designation</th><th>Phone</th><th>Email</th></tr>{% for s in staff %}<tr><td>{{s.name}}</td><td>{{s.designation}}</td><td>{{s.phone}}</td><td>{{s.email}}</td></tr>{% empty %}<tr><td colspan="4" class="empty">No staff.</td></tr>{% endfor %}</table></div></div>{% endblock %}
