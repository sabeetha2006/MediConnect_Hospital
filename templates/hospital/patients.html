{% extends "hospital/base.html" %}{% block content %}<div class="dashboard-head"><div><span class="eyebrow">ADMIN</span><h1>Patients</h1></div></div><div class="panel"><div class="table-wrap"><table><tr><th>ID</th><th>Name</th><th>Age</th><th>Phone</th><th>Email</th></tr>{% for p in patients %}<tr><td>#{{p.id}}</td><td><b>{{p.name}}</b></td><td>{{p.age}}</td><td>{{p.phone}}</td><td>{{p.email}}</td></tr>{% empty %}<tr><td colspan="5" class="empty">No patients.</td></tr>{% endfor %}</table></div></div>{% endblock %}
