{% extends "hospital/base.html" %}{% block content %}<div class="dashboard-head"><div><span class="eyebrow">ADMIN</span><h1>Bills & Payments</h1></div></div><div class="panel"><div class="table-wrap"><table><tr><th>Bill</th><th>Patient</th><th>Doctor</th><th>Total</th><th>Payment</th></tr>{% for b in bills %}<tr><td>#{{b.id}}</td><td>{{b.patient.name}}</td><td>Dr. {{b.appointment.doctor.name}}</td><td>₹{{b.total}}</td><td><span class="pill {{b.payment_status|lower}}">{{b.payment_status}}</span></td></tr>{% empty %}<tr><td colspan="5" class="empty">No bills.</td></tr>{% endfor %}</table></div></div>{% endblock %}
