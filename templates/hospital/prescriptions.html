{% extends "hospital/base.html" %}{% block content %}<div class="dashboard-head"><div><span class="eyebrow">ADMIN</span><h1>Prescriptions</h1></div></div><div class="panel"><div class="table-wrap"><table><tr><th>Patient</th><th>Doctor</th><th>Medicine</th><th>Dosage</th><th>Duration</th></tr>{% for p in prescriptions %}<tr><td>{{p.patient.name}}</td><td>Dr. {{p.doctor.name}}</td><td><b>{{p.medicine}}</b></td><td>{{p.dosage}}</td><td>{{p.duration}}</td></tr>{% empty %}<tr><td colspan="5" class="empty">No prescriptions.</td></tr>{% endfor %}</table></div></div>{% endblock %}
