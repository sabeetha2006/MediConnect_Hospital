{% extends "hospital/base.html" %}{% block content %}<div class="dashboard-head"><div><span class="eyebrow">ADMIN</span><h1>Departments</h1></div><a class="btn primary" href="{% url 'add_department' %}">＋ Add Department</a></div><div class="panel"><div class="table-wrap"><table><tr><th>ID</th><th>Name</th><th>Description</th></tr>{% for d in departments %}<tr><td>#{{d.id}}</td><td><b>{{d.name}}</b></td><td>{{d.description|default:"—"}}</td></tr>{% empty %}<tr><td colspan="3" class="empty">No departments.</td></tr>{% endfor %}</table></div></div>{% endblock %}
