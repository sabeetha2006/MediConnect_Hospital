{% extends "hospital/base.html" %}{% block content %}<div class="dashboard-head"><div><span class="eyebrow">ADMIN</span><h1>Doctor Attendance</h1></div></div><div class="panel"><div class="table-wrap"><table><tr><th>Doctor</th><th>Date</th><th>Status</th></tr>{% for a in attendance %}<tr><td>Dr. {{a.doctor.name}}</td><td>{{a.attendance_date|date:"d M Y"}}</td><td><span class="pill {{a.status|lower|cut:" "}}">{{a.status}}</span></td></tr>{% empty %}<tr><td colspan="3" class="empty">No attendance.</td></tr>{% endfor %}</table></div></div>{% endblock %}
