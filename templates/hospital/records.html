{% extends "hospital/base.html" %}{% block content %}<div class="dashboard-head"><div><span class="eyebrow">ADMIN</span><h1>Medical Records</h1></div></div><div class="panel"><div class="table-wrap"><table><tr><th>Patient</th><th>Doctor</th><th>Date</th><th>Diagnosis</th></tr>{% for r in records %}<tr><td>{{r.patient.name}}</td><td>Dr. {{r.doctor.name}}</td><td>{{r.record_date|date:"d M Y"}}</td><td>{{r.diagnosis|default:"—"}}</td></tr>{% empty %}<tr><td colspan="4" class="empty">No records.</td></tr>{% endfor %}</table></div></div>{% endblock %}
