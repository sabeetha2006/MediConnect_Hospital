{% extends "hospital/base.html" %}{% block content %}<div class="dashboard-head"><div><span class="eyebrow">ADMIN</span><h1>Doctors</h1></div><a class="btn primary" href="{% url 'add_doctor' %}">＋ Add Doctor</a></div><div class="panel"><div class="table-wrap"><table><tr><th>Name</th><th>Specialization</th><th>Department</th><th>Phone</th><th>Experience</th></tr>{% for d in doctors %}<tr><td>Dr. {{d.name}}</td><td>{{d.specialization}}</td><td>{{d.department|default:"—"}}</td><td>{{d.phone}}</td><td>{{d.experience}} yrs</td></tr>{% empty %}<tr><td colspan="5" class="empty">No doctors.</td></tr>{% endfor %}</table></div></div>{% endblock %}
